<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Canevyn — Smart Assistive Mobility System</title>
  
  <!-- Atkinson Hyperlegible Next (low-vision optimized character differentiation) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,400..700,0..1,-50..200" rel="stylesheet" />

  <!-- Canevyn Sentinel Design System Tokens -->
  <link rel="stylesheet" href="/static/assets/css/canevyn-sentinel.css?v=4.3" />

  <!-- Leaflet Interactive Map (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#08122d",
            "surface-dim": "#08122d",
            "surface-bright": "#2f3855",
            "surface-container-lowest": "#030c28",
            "surface-container-low": "#111a36",
            "surface-container": "#151e3a",
            "surface-container-high": "#202945",
            "surface-container-highest": "#2b3450",
            "on-surface": "#dbe1ff",
            "on-surface-variant": "#d5c4ac",
            "outline": "#9e8f78",
            "outline-variant": "#514532",
            "surface-tint": "#ffba27",
            "primary": "#ffdba0",
            "on-primary": "#422c00",
            "primary-container": "#ffb703",
            "on-primary-container": "#6b4b00",
            "secondary": "#40efb7",
            "on-secondary": "#003827",
            "secondary-container": "#00d29c",
            "on-secondary-container": "#00543d",
            "tertiary": "#ffd6da",
            "error": "#ffb4ab",
            "on-error": "#690005",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "primary-fixed": "#ffdea9",
            "primary-fixed-dim": "#ffba27",
            "secondary-fixed": "#54fdc4",
            "secondary-fixed-dim": "#27e0a9",
            "background": "#08122d",
            "on-background": "#dbe1ff"
          },
          fontFamily: {
            "sans": ["Atkinson Hyperlegible Next", "sans-serif"],
            "headline-xl": ["Atkinson Hyperlegible Next", "sans-serif"],
            "headline-xl-mobile": ["Atkinson Hyperlegible Next", "sans-serif"],
            "headline-lg": ["Atkinson Hyperlegible Next", "sans-serif"],
            "headline-lg-mobile": ["Atkinson Hyperlegible Next", "sans-serif"],
            "headline-md": ["Atkinson Hyperlegible Next", "sans-serif"],
            "body-xl": ["Atkinson Hyperlegible Next", "sans-serif"],
            "body-lg": ["Atkinson Hyperlegible Next", "sans-serif"],
            "body-md": ["Atkinson Hyperlegible Next", "sans-serif"],
            "label-lg": ["Atkinson Hyperlegible Next", "sans-serif"],
            "label-md": ["Atkinson Hyperlegible Next", "sans-serif"],
            "telemetry-num": ["Atkinson Hyperlegible Next", "sans-serif"]
          },
          fontSize: {
            "headline-xl": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "headline-xl-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "800" }],
            "headline-lg": ["30px", { lineHeight: "38px", fontWeight: "700" }],
            "headline-lg-mobile": ["26px", { lineHeight: "34px", fontWeight: "700" }],
            "headline-md": ["24px", { lineHeight: "32px", fontWeight: "700" }],
            "body-xl": ["22px", { lineHeight: "32px", fontWeight: "400" }],
            "body-lg": ["20px", { lineHeight: "28px", fontWeight: "500" }],
            "body-md": ["18px", { lineHeight: "26px", fontWeight: "400" }],
            "label-lg": ["18px", { lineHeight: "24px", letterSpacing: "0.02em", fontWeight: "700" }],
            "label-md": ["16px", { lineHeight: "22px", letterSpacing: "0.04em", fontWeight: "700" }],
            "telemetry-num": ["36px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "800" }]
          }
        }
      }
    };
  </script>
</head>
<body class="text-on-surface antialiased min-h-screen flex flex-col select-none">
  <!-- Screen-reader live region outside #app so announcements persist across view transitions -->
  <div id="a11yLiveAnnouncer" class="sr-only" aria-live="polite" role="status"></div>
  <!-- Application Root Mount Point -->
  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="/static/js/app.js?v=4.6"></script>
</body>
</html>
